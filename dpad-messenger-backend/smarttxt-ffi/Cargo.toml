[package]
name = "smarttxt-ffi"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

# Phase B (SMARTTXT_NATIVE_BACKEND_PLAN.md §3): a thin JNI wrapper crate over
# OpenBubbles' rustpush. Cross-compiled to Android .so files and dropped into
# smarttxt/src/main/jniLibs/. The Kotlin side calls the
# exported functions via `external fun` in RustPushNative.kt.
#
# Build with: scripts/build-rustpush-so.sh   (needs Rust + Android NDK)

[lib]
crate-type = ["cdylib"]   # produces lib<name>.so for Android

[dependencies]
# JNI bindings. The exported symbols match
# Java_com_offline_dpadmessenger_backend_smarttxt_RustPushNative_native*.
jni = "0.21"

# Async runtime rustpush needs (it is tokio-based).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

# JSON for the config in / result + event out across the JNI boundary.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
log = "0.4"
android_logger = "0.13"
# Already a mandatory dependency of android_logger 0.13 (it re-exports
# `env_logger::filter` through Config::with_filter); naming it directly just lets
# init_logger build the per-target filter. default-features = false matches how
# android_logger pulls it in, so no extra crates (regex etc.) enter the graph.
env_logger = { version = "0.10", default-features = false }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
plist = "1"
# Rebuilding OpenBubbles' anisette adi_pb blob (convert_anisette): its client_secret/
# mid/metadata are raw <data> that get re-base64'd into the adi_pb JSON. Matches the
# rustpush tree's base64 (0.21) so cargo doesn't compile a second copy.
base64 = "0.21"

# The dumb hardware file is a protobuf. Decoded here (not in rustpush) against
# OpenBubbles' own schema — see build.rs and src/macos_remote.rs. Versions match
# the rustpush tree so cargo doesn't compile a second copy of either.
prost = "0.12.0"
# `impl OSConfig for MacOSConfigRemote` — rustpush's trait is #[async_trait].
async-trait = "0.1.73"
# Client UDID generation (mirrors OpenBubbles' generate_udid).
rand = { version = "0.8.5", features = ["min_const_gen"] }
# For installing the process-global rustls crypto provider (ring) before any TLS,
# same as the imessage-register harness. Match rustpush's rustls (0.23).
#
# `default-features = false` is load-bearing, not cosmetic. rustls 0.23's DEFAULT
# feature set includes the aws-lc-rs provider, and cargo features are ADDITIVE
# across the graph — so leaving defaults on here would pull `aws-lc-sys` back in
# even though rustpush now pins rustls to ring. aws-lc-sys is a big cmake-built
# C/asm blob: megabytes in the .so and a cross-compile hazard on armv7-android.
# We install ring explicitly in lib.rs (`rustls::crypto::ring::default_provider()
# .install_default()`), so the aws-lc provider is dead weight either way.
# Keep this in sync with rustpush's Cargo.toml.
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }

# --- OpenBubbles rustpush (ENABLED) ----------------------------------------
# The phone runs rustpush for activation/APNs/auth/register/send. We use its
# built-in `RelayConfig` so the device identity AND validation data both come from
# the OpenBubbles relay (https://hw.openbubbles.app) — no local absinthe is ever
# CALLED. `remote-anisette-v3` gives anisette out of the box (omnisette's remote
# anisette provider, default server https://ani.sidestore.io) — NOT ClearADI,
# which only vendors ADI libs for arm64/x86_64 and hits a compile_error! on the
# armeabi-v7a (32-bit) target this ships to. omnisette + keystore are direct deps
# pinned to the SAME feature so cargo unifies the graph.
#
# default-features = false DROPS the `macos-validation-data` feature, so
# open-absinthe (and its `unicorn-engine` C dep, which will NOT cross-compile to
# Android) is never compiled. rustpush already gates its ONLY open-absinthe
# reference (the `AbsintheError` use + variant in error.rs) behind that feature.
#
# `MacOSConfigRemote` (src/macos_remote.rs) is OURS, not rustpush's: it reuses the
# migrated OpenBubbles device identity but offloads NAC create/sign to the validation
# server. It implements rustpush's `OSConfig` trait on a local type (allowed by the
# orphan rule), so rustpush needs no feature flag for it and stays near upstream.
# nativeInit prefers it when a migrated os_config + dumb are present, else falls
# back to `RelayConfig`.
#
# Path points at the vendored ~/repos/rustpush (the compiler-checked reference is
# ../../imessage-register). To pin a git rev, swap `path` for `git`/`rev` —
# rustpush has submodules, so clone with --recurse-submodules.
rustpush = { path = "../../../rustpush", default-features = false, features = ["remote-anisette-v3"] }
# apple-private-apis moved under third_party/ upstream at rustpush@71b66f9;
# repointed here in the same change that bumped rustpush-ref past that move
# (see build-smarttxt-so/action.yml). keystore did NOT move.
omnisette = { path = "../../../rustpush/third_party/apple-private-apis/omnisette", features = ["remote-anisette-v3"] }
keystore = { path = "../../../rustpush/keystore" }

[build-dependencies]
prost-build = { version = "0.12.0" }

[profile.release]
opt-level = "z"     # optimize for size — these go on a 916 MB-RAM flip phone
lto = true
codegen-units = 1
strip = true
# NOT "abort": rustpush has `.unwrap()`/`.expect()` paths (e.g. "No identity for
# payload" when a registration goes stale / a resource is closed) that panic. With
# "abort" any such panic SIGABRTs the whole app on an incoming message. "unwind"
# lets tokio contain a panic to the failing task (see the per-message receive loop
# in lib.rs) instead of crashing the process.
panic = "unwind"

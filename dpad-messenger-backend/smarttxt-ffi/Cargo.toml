[package]
name = "smarttxt-ffi"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

# Phase B (SMARTTXT_NATIVE_BACKEND_PLAN.md §3): a thin JNI wrapper crate over
# OpenBubbles' rustpush. Cross-compiled to Android .so files and dropped into
# smarttxt/src/main/jniLibs/. The Kotlin side calls the
# exported functions via `external fun` in RustPushNative.kt.
#
# Build with: scripts/build-rustpush-so.sh   (needs Rust + Android NDK)

[lib]
crate-type = ["cdylib"]   # produces lib<name>.so for Android

[dependencies]
# JNI bindings. The exported symbols match
# Java_com_offline_dpadmessenger_backend_smarttxt_RustPushNative_native*.
jni = "0.21"

# Async runtime rustpush needs (it is tokio-based).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

# JSON for the config in / result + event out across the JNI boundary.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
log = "0.4"
android_logger = "0.13"

# --- OpenBubbles rustpush --------------------------------------------------
# The phone runs rustpush for activation/APNs/auth/register/send. Build it with
# `default-features = false` so the closed open-absinthe (macos-validation-data)
# is NOT pulled in — this is an ARM device and validation bytes come in via
# nativeRegister(...) from the relay (`../nacserver`). Pin a rev before shipping
# ("do not float on main"). rustpush has git submodules — clone with
# --recurse-submodules when you vendor it.
#
# The exact integration is the same one verified in the `../../imessage-register`
# Mac harness (RelayOSConfig + the activate→auth→register→send flow). Port that
# flow into the JNI functions below once the harness compiles against your pinned
# rustpush rev — that harness is the compiler-checked reference for this wiring.
#
# rustpush = { git = "https://github.com/OpenBubbles/rustpush", rev = "<PIN>", default-features = false }
#
# NOTE: enabling this makes the crate depend on the full rustpush build (it no
# longer compiles standalone). Until then, lib.rs runs in stub mode and Kotlin
# falls back to the relay/mock transport (RustPushBridge.NATIVE_AVAILABLE).

[profile.release]
opt-level = "z"     # optimize for size — these go on a 916 MB-RAM flip phone
lto = true
codegen-units = 1
strip = true
panic = "abort"

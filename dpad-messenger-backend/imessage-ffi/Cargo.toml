[package]
name = "imessage-ffi"
version = "0.1.0"
edition = "2021"
publish = false

# Phase B (IMESSAGE_NATIVE_BACKEND_PLAN.md §3): a thin JNI wrapper crate over
# OpenBubbles' rustpush. Cross-compiled to Android .so files and dropped into
# imessage/src/main/jniLibs/. The Kotlin side calls the
# exported functions via `external fun` in RustPushNative.kt.
#
# Build with: scripts/build-rustpush-so.sh   (needs Rust + Android NDK)

[lib]
crate-type = ["cdylib"]   # produces lib<name>.so for Android

[dependencies]
# JNI bindings. The exported symbols match
# Java_com_offline_dpadmessenger_backend_imessage_RustPushNative_native*.
jni = "0.21"

# Async runtime rustpush needs (it is tokio-based).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

# JSON for the config in / result + event out across the JNI boundary.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
log = "0.4"
android_logger = "0.13"

# --- OpenBubbles rustpush --------------------------------------------------
# Pin a known-good commit and vendor it (plan §3: "do not float on main").
# Uncomment and set the rev once you've pinned it; the lib.rs integration
# points are marked `RUSTPUSH:` for where its API is called.
#
# rustpush = { git = "https://github.com/OpenBubbles/rustpush", rev = "<PIN>" }
#
# rustpush references open-absinthe as a submodule; on the phone we DON'T run it
# — this is an ARM device and the nac engine emulates an x86-64 Apple binary, so
# validation bytes come in via nativeRegister(...) from the relay (`../nacserver`,
# which IS the working open-absinthe replacement). If you ever build a native
# desktop/server path in Rust, depend on the sibling `../absinthe` crate (a
# drop-in for open-absinthe::nac). See ABSINTHE_RE_FINDINGS.md.

[profile.release]
opt-level = "z"     # optimize for size — these go on a 916 MB-RAM flip phone
lto = true
codegen-units = 1
strip = true
panic = "abort"

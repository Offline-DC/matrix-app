[package]
name = "dpadspotify-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "dpadspotify"
crate-type = ["cdylib"]

# NOTE: Cargo.lock pins vergen to 9.0.6 (matching librespot's own lockfile).
# vergen 9.1 + vergen-lib drifted apart and librespot-core's build script
# fails to compile against the pair — don't blanket `cargo update`.

[dependencies]
# rustls-tls-webpki-roots everywhere: no OpenSSL to cross-compile, and no
# dependence on the device's system cert store (which on old Android lacks
# newer roots). Mozilla's bundled roots ship inside the .so.
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "0.8.0", default-features = false, features = ["with-libmdns", "rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }

jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
log = "0.4"
sha1 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
# The flip phone has little storage; squeeze the .so.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
